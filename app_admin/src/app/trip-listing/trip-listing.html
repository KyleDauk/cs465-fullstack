<div>
  <button (click)="addTrip()" class="btn btn-info">Add Trip</button>
</div>

<div class="row">
  @for (trip of trips(); track trip.code) {
    <div class="col-md-4">
      <app-trip-card [trip]="trip" class="card-deck mt-2"></app-trip-card>
    </div>
  } @empty {
    <p class="mt-3">{{ message() || 'Loading trips...' }}</p>
  }
</div>
